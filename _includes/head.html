<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Romain Berger</title>
<style>
    * {
        box-sizing: border-box;
    }
    body, html {
        margin: 0;
        padding: 0;
        background: #2e2e2e;
        color: #eee;
        font-family: roboto, helvetica neue, sans-serif;
        background-image: url('/assets/home.jpg');
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center center;
    }

    a {
        text-decoration: none;
        color: #eee;
    }

    .menu {
        margin: 0;
        padding: 0;
        text-align: center;
        text-transform: uppercase;
        font-size: 30px;
    }

    .menu li {
        display: inline-block;
        margin: 0;
        padding: 0 20px;
    }

    @media (max-width: 600px) {
        .menu li {
            display: block;
            padding: 20px 0;
        }
    }

    .menu a:hover {
        color: #fff;
        border-top: 1px solid #fff;
        border-bottom: 1px solid #fff;
    }

    .page-menu {
        padding: 20px 0;
    }

    .home-body {
        height: 100vh;
        width: 100%;
        position: relative;
    }

    .home-menu {
        position: relative;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    .music-body {
        background-image: url('/assets/background-dark.jpg');
    }

    .music-wrapper {
        display: flex;
        flex-direction: row;
    }

    .music-wrapper > div {
        width: 50%;
    }

    .music-list {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 3vw;
        padding: 20px;
    }

    .music-list a {
        display: block;
        max-height: calc((90vh - 9vw) / 2.3333333333333);
    }

    .music-list img {
        width: 100%;
    }

    @media (max-width: 600px) {
        .music-list {
            display: block;
        }

        .music-list a {
            margin-bottom: 20px;
        }
    }

    .music-content {
        padding: 20px;
        background: #eee;
        color: #2e2e2e;
    }

    .music-select {
        list-style: none;
    }

    .music-select li {
        display: inline-block;
        border-right: 1px white solid;
        padding: 0 15px;
        cursor: pointer;
        color: #aaa;
    }
    .music-select li:last-child {
        border-right: none;
    }

    .music-select .selected {
        color: #fff;
    }

    .artist,
    .title,
    .year {
        text-align: center;
        margin: 0;
    }

    .title {
        margin: 20px 0 10px;
    }

    .track-listing {
        margin: 10px;
        padding: 10px;
        background: #2e2e2e;
        color: #eee;
    }

    .music-content h2 {
        margin: 0;
        padding: 0;
        text-align: center;
    }

    .stream-links {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        margin: 40px;
        border: 2px solid #2e2e2e;
        border-top: none;
        border-bottom: none;
        border-radius: 30px;
        padding: 10px 0;
    }

    @media (max-width: 600px) {
        .stream-links {
            flex-direction: column;
        }
    }

    .stream-links a {
        display: block;
    }

    .stream-links img {
        height: 25px;
        filter: grayscale(100%);
    }

    .stream-links a:hover img {
        filter: none;
    }

    .artwork {
        width: calc(100% - 20px);
        margin: 0 10px;
    }

    .credits a {
        color: #2e2e2e;
        text-decoration: underline;
    }

    .yt-frame {
        margin: 0 10px 20px;
        position: relative;
        padding-bottom: 56.25%;
        padding-top: 25px;
        height: 0;
    }

    .yt-frame iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    .links-body {
        height: 100vh;
        width: 100%;
        background: #000;
    }

    .links-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .links-section {
        min-width: 400px;
        margin: 0;
        padding: 20px;
        text-align: center;
    }

    .links-section ul {
        list-style: none;
        font-size: 20px;
        margin: 0;
        padding: 0;
    }

    .links-section li {
        background: #2e2e2e;
        margin-bottom: 15px;
        border-radius: 10px;
    }

    .links-section a {
        display: block;
        padding: 25px 0;
        width: 100%;
        height: 100%;
    }
</style>
